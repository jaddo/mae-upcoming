name: ICS to JSON

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regeneration even if ICS is unchanged'
        required: false
        default: false
        type: boolean
      enrich_titles:
        description: 'Fetch event page subtitle into title field (default true)'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Ensure this only runs on the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      skip_generation: ${{ steps.check_change.outputs.skip }}
    env:
      # Empty until upcoming.mae.princeton.edu exists in DNS. A CNAME file
      # naming an unresolvable host redirects the github.io URL to it and takes
      # the site down; see actions/prepare-pages-artifact.
      PAGES_CNAME: ${{ vars.PAGES_CNAME }}
      ICS_URL: ${{ vars.ICS_URL || 'https://mae.princeton.edu/feeds/events/ical.ics' }}
      REPO_VARIABLE: ${{ vars.REPO_VARIABLE }}
      OUTPUT_FILE: ${{ vars.OUTPUT_FILE }}
      FALLBACK_PREPEND_TEXT: ${{ vars.FALLBACK_PREPEND_TEXT || '{a_an} {series} Talk by' }}
      FALLBACK_INCLUDE_SPEAKER: ${{ vars.FALLBACK_INCLUDE_SPEAKER || '1' }}
      EXCLUDE_SERIES: ${{ vars.EXCLUDE_SERIES }}
      # MAE inverts ORFE: the ICS SUMMARY already carries the talk title (see
      # transform_config.json), so what the event page supplies is the speaker.
      # Defaults live here rather than only in repo variables so a fresh clone
      # reproduces MAE's behavior; a repo variable still overrides.
      ENRICH_TARGET_FIELD: ${{ vars.ENRICH_TARGET_FIELD || 'speaker' }}
      # Seminar pages carry .event-subtitle; FPO pages carry only the speaker
      # field. Tried left to right.
      ENRICH_SUBTITLE_SELECTOR: ${{ vars.ENRICH_SUBTITLE_SELECTOR || '.field--name-field-ps-event-speaker-name, div.event-subtitle' }}
      # mae.princeton.edu sits behind a Cloudflare managed challenge that 403s
      # every non-browser client. Without this header all enrichment silently
      # returns empty.
      BOT_BYPASS_HEADER_VALUE: ${{ vars.BOT_BYPASS_HEADER_VALUE || '1' }}
      FORCE_REBUILD: ${{ github.event.inputs.force }}
      # Logic for enrichment flag: always on for schedule, respects input for dispatch
      ENRICH_FLAG: ${{ (github.event_name == 'schedule' || github.event.inputs.enrich_titles == 'true') && '--enrich-titles' || '' }}
      # Always include raw details and raw extracts in production builds
      RAW_DETAILS_FLAG: "--enrich-raw-details"
      EXTRACT_FLAGS: "--enrich-raw-extracts"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Load failure streak
        id: load_streak
        run: |
          count=$(cat .ci/failure-streak 2>/dev/null || echo 0)
          echo "current=$count" >> "$GITHUB_OUTPUT"

      - name: Check ICS change
        id: check_change
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ICS_URL}" ]; then echo "ICS_URL not set" >&2; exit 1; fi
          
          curl -fsSL "$ICS_URL" -o current.ics
          new_hash=$(sha256sum current.ics | cut -d ' ' -f1)
          echo "New ICS SHA256: $new_hash"

          # The gate is the ICS hash alone. ORFE additionally keyed it on the
          # newsletter edition, because that window moves on the calendar even
          # through a quiet week; MAE does not publish the newsletter variant,
          # so there is nothing time-driven left to roll over.
          prev_body=$(gh release view latest --json body -q '.body' 2>/dev/null || echo "")
          prev_hash=$(printf '%s' "$prev_body" | grep -Eo 'ICS_SHA256:[0-9a-f]+' | cut -d: -f2 || echo "")
          echo "Previous ICS SHA256: ${prev_hash:-<none>}"

          if [ "${FORCE_REBUILD:-false}" = "true" ]; then
            echo "Force rebuild requested." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$new_hash" = "$prev_hash" ] && [ -n "$prev_hash" ]; then
            echo "ICS unchanged; skipping generation." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "hash=$new_hash" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.check_change.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies and test
        if: steps.check_change.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Generate JSON
        if: steps.check_change.outputs.skip != 'true'
        run: |
          python -m src.main --ics-url "${ICS_URL}" --repo-variable "${REPO_VARIABLE}" \
            --output "${OUTPUT_FILE:-events.json}" \
            ${ENRICH_FLAG} ${RAW_DETAILS_FLAG} ${EXTRACT_FLAGS}

      - name: Validate JSON against schema
        if: steps.check_change.outputs.skip != 'true'
        run: |
          python tools/validate_json.py --schema schema/events.schema.json --data "${OUTPUT_FILE:-events.json}"

      - name: Publish "latest" releases
        if: steps.check_change.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUTPUT_ASSET="${OUTPUT_FILE:-events.json}"
          TAG="latest"
          TITLE="Latest Events"
          BODY="Automated update of events feed. ICS_SHA256:${{ steps.check_change.outputs.hash }}"

          # Overwrite existing 'latest' release
          gh release delete "$TAG" -y 2>/dev/null || true
          gh release create "$TAG" "$OUTPUT_ASSET" --title "$TITLE" --notes "$BODY" --latest

          echo "Canonical asset URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${OUTPUT_ASSET}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare and upload Pages artifact
        if: steps.check_change.outputs.skip != 'true'
        uses: ./actions/prepare-pages-artifact
        with:
          cname: ${{ env.PAGES_CNAME }}
          prod-events-source: local
          prod-events-file: ${{ env.OUTPUT_FILE || 'events.json' }}
          dev-events-source: release
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JSON artifact
        if: steps.check_change.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: events-json
          path: ${{ env.OUTPUT_FILE || 'events.json' }}

      - name: Handle success/failure streak
        if: always() # This step runs regardless of job status
        uses: ./actions/update-failure-streak # Assumes you move the logic to a local action for cleanliness
        with:
          job-status: ${{ job.status }}
          streak-file: .ci/failure-streak
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: build-and-publish
    if: needs.build-and-publish.result == 'success' && needs.build-and-publish.outputs.skip_generation != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
